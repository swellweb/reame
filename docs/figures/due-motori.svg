<svg viewBox="0 0 840 320" width="840" height="320" xmlns="http://www.w3.org/2000/svg" style="background:#FBFAF6" role="img" aria-label="Two engines under one API">
  <defs>
    <marker id="fm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#20242E"/>
    </marker>
  </defs>

  <!-- The one API on top -->
  <rect x="270" y="20" width="300" height="52" rx="8" fill="#20242E"/>
  <text x="420" y="42" font-size="14" font-weight="700" fill="#FBFAF6" text-anchor="middle">Reame — one OpenAI API</text>
  <text x="420" y="60" font-size="11" fill="#D8D4C8" text-anchor="middle">chat · /v1/warm · sessions · prefix cache</text>

  <!-- Decision -->
  <text x="420" y="102" font-size="12" font-weight="650" fill="#20242E" text-anchor="middle">which file is the model?</text>
  <line x1="420" y1="72" x2="420" y2="88" stroke="#20242E" stroke-width="1.5"/>
  <line x1="420" y1="108" x2="230" y2="140" stroke="#20242E" stroke-width="1.5" marker-end="url(#fm-arr)"/>
  <line x1="420" y1="108" x2="610" y2="140" stroke="#20242E" stroke-width="1.5" marker-end="url(#fm-arr)"/>
  <text x="290" y="122" font-size="12" font-weight="700" fill="#2E6E62">model.nuc</text>
  <text x="500" y="122" font-size="12" font-weight="700" fill="#B26A1B">model.gguf</text>

  <!-- nucleo lane -->
  <rect x="60" y="148" width="340" height="130" rx="8" fill="#E4EFEA" stroke="#2E6E62" stroke-width="1.5"/>
  <text x="230" y="172" font-size="14" font-weight="700" fill="#2E6E62" text-anchor="middle">nucleo — our engine, from scratch</text>
  <text x="230" y="194" font-size="12" fill="#20242E" text-anchor="middle">small models (0.5B – 3B)</text>
  <text x="230" y="216" font-size="12" fill="#20242E" text-anchor="middle">converted once, memory-mapped forever</text>
  <text x="230" y="242" font-size="13" font-weight="700" fill="#2E6E62" text-anchor="middle">starts at 99 MB · decode +31% vs llama.cpp</text>
  <text x="230" y="264" font-size="11" fill="#5B6068" text-anchor="middle">the fast lane: concierge, extraction</text>

  <!-- llama.cpp lane -->
  <rect x="440" y="148" width="340" height="130" rx="8" fill="#F7EBDA" stroke="#B26A1B" stroke-width="1.5"/>
  <text x="610" y="172" font-size="14" font-weight="700" fill="#B26A1B" text-anchor="middle">llama.cpp — the upstream engine</text>
  <text x="610" y="194" font-size="12" fill="#20242E" text-anchor="middle">large and MoE models (7B+)</text>
  <text x="610" y="216" font-size="12" fill="#20242E" text-anchor="middle">pinned submodule, CPU-only build</text>
  <text x="610" y="242" font-size="13" font-weight="700" fill="#B26A1B" text-anchor="middle">where nucleo does not win yet</text>
  <text x="610" y="264" font-size="11" fill="#5B6068" text-anchor="middle">the deep lane: reasoning, long answers</text>

  <text x="420" y="306" font-size="11" fill="#5B6068" text-anchor="middle">same caches, same sessions, same everything else — only the machine room changes</text>
</svg>
