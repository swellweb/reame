<svg viewBox="0 0 840 360" width="840" height="360" xmlns="http://www.w3.org/2000/svg" style="background:#FBFAF6" role="img" aria-label="The concierge cascade with measured times">
  <defs>
    <marker id="cc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#20242E"/>
    </marker>
  </defs>

  <text x="20" y="32" font-size="15" font-weight="750" fill="#20242E">The concierge: real language models underneath, one shortcut for the easy case</text>

  <!-- Step 0: page load / warm -->
  <rect x="20" y="56" width="230" height="64" rx="8" fill="#EDEBE3" stroke="#5B6068" stroke-width="1.2"/>
  <text x="135" y="80" font-size="12" font-weight="700" fill="#20242E" text-anchor="middle">visitor opens the page</text>
  <text x="135" y="99" font-size="11" fill="#5B6068" text-anchor="middle">widget pings /v1/warm — the big</text>
  <text x="135" y="112" font-size="11" fill="#5B6068" text-anchor="middle">model reads the document, invisibly</text>

  <!-- Question -->
  <rect x="20" y="156" width="230" height="44" rx="8" fill="#20242E"/>
  <text x="135" y="183" font-size="13" font-weight="700" fill="#FBFAF6" text-anchor="middle">visitor asks a question</text>
  <line x1="135" y1="120" x2="135" y2="150" stroke="#5B6068" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Road 1: selector -->
  <line x1="250" y1="178" x2="300" y2="178" stroke="#20242E" stroke-width="1.5" marker-end="url(#cc-arr)"/>
  <rect x="305" y="140" width="240" height="76" rx="8" fill="#E4EFEA" stroke="#2E6E62" stroke-width="1.5"/>
  <text x="425" y="162" font-size="12" font-weight="700" fill="#2E6E62" text-anchor="middle">1 · direct answer from your data</text>
  <text x="425" y="180" font-size="11" fill="#20242E" text-anchor="middle">a shortcut, not the brain: fires only</text>
  <text x="425" y="194" font-size="11" fill="#20242E" text-anchor="middle">when it is SURE it understood</text>
  <text x="425" y="210" font-size="13" font-weight="750" fill="#2E6E62" text-anchor="middle">~20 ms · value copied, never invented</text>

  <!-- Road 2: small model -->
  <line x1="425" y1="216" x2="425" y2="242" stroke="#20242E" stroke-width="1.5" marker-end="url(#cc-arr)"/>
  <text x="437" y="234" font-size="10" fill="#5B6068">any doubt?</text>
  <rect x="305" y="248" width="240" height="60" rx="8" fill="#E4EFEA" stroke="#2E6E62" stroke-width="1.5"/>
  <text x="425" y="270" font-size="12" font-weight="700" fill="#2E6E62" text-anchor="middle">2 · small language model</text>
  <text x="425" y="288" font-size="11" fill="#20242E" text-anchor="middle">understands the visitor's own words</text>
  <text x="425" y="302" font-size="13" font-weight="750" fill="#2E6E62" text-anchor="middle">~3.6 s</text>

  <!-- Road 3: escalation -->
  <line x1="545" y1="278" x2="595" y2="278" stroke="#20242E" stroke-width="1.5" marker-end="url(#cc-arr)"/>
  <text x="548" y="268" font-size="10" fill="#5B6068">it refuses?</text>
  <rect x="600" y="248" width="220" height="60" rx="8" fill="#F7EBDA" stroke="#B26A1B" stroke-width="1.5"/>
  <text x="710" y="270" font-size="12" font-weight="700" fill="#B26A1B" text-anchor="middle">3 · big model — already warm</text>
  <text x="710" y="288" font-size="11" fill="#20242E" text-anchor="middle">automatic relay, one single POST</text>
  <text x="710" y="302" font-size="13" font-weight="750" fill="#B26A1B" text-anchor="middle">~3.2 s (was 59 s cold)</text>

  <!-- The rule -->
  <rect x="600" y="140" width="220" height="76" rx="8" fill="#FBFAF6" stroke="#5B6068" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="710" y="164" font-size="12" font-weight="700" fill="#20242E" text-anchor="middle">the one rule</text>
  <text x="710" y="182" font-size="11" fill="#20242E" text-anchor="middle">a value never in the data is a</text>
  <text x="710" y="196" font-size="11" fill="#20242E" text-anchor="middle">value it cannot say — and "not</text>
  <text x="710" y="210" font-size="11" fill="#20242E" text-anchor="middle">here" beats a confident guess</text>

  <text x="420" y="344" font-size="11" fill="#5B6068" text-anchor="middle">times measured on a free 4-core ARM box (Oracle free tier) — no path above 4 seconds</text>
</svg>
